# Prometheus scrape config for the vLLM engine and the LMCache MP server.
#
# The cluster's kube-prometheus-stack Prometheus has:
#   serviceMonitorSelector:          matchLabels: {release: prometheus}
#   serviceMonitorNamespaceSelector: {}   (all namespaces)
# so every ServiceMonitor here MUST carry the label `release: prometheus`.
#
#   kubectl apply -f servicemonitors.yaml
#   # verify it was picked up (~30s):
#   kubectl -n monitoring exec sts/prometheus-prometheus-kube-prometheus-prometheus -c prometheus -- \
#     wget -qO- localhost:9090/api/v1/targets | grep -o '"job":"[^"]*"' | sort -u
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-nemotron
  namespace: vllm
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      # The variant-agnostic Service `vllm-nemotron-active`
      # (nemotron/common/service-active.yaml, port name: http -> 8000), NOT a
      # per-variant one. It selects on the pod label `serving: nemotron` that
      # both nemotron variants carry, so this is ONE continuous scrape target
      # that spans a variant switch -- and it fixes BF16 having been entirely
      # unscraped while the selector named the NVFP4 Service directly.
      app: vllm-nemotron-active
  namespaceSelector:
    matchNames: ["vllm"]
  # Copy the pod's `variant` label (nvfp4 | bf16) onto every series, so a query
  # can tell which engine produced a sample. Without this the switch is
  # invisible in the metrics and two variants' numbers silently concatenate.
  podTargetLabels:
    - variant
  endpoints:
    - port: http # vLLM serves /metrics on the API port
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-gemma4
  namespace: vllm
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: vllm-gemma4 # the Service `vllm-gemma4` (port name: http -> 8088)
  namespaceSelector:
    matchNames: ["vllm"]
  endpoints:
    - port: http # vLLM serves /metrics on the API port
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lmcache
  namespace: vllm
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      # This label lives on exactly one Service -- `lmcache-http` in
      # nemotron/common/lmcache-services.yaml -- which selects on the pod label
      # `serving: lmcache` and therefore follows whichever variant's LMCache
      # server is currently up (there is one per variant). One scrape target,
      # continuous across a switch; the headless `lmcache` Service is
      # deliberately NOT labelled, or it would double-scrape the same pod.
      monitoring: "true"
  namespaceSelector:
    matchNames: ["vllm"]
  endpoints:
    - port: http # FastAPI frontend on 8080 also serves /metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
