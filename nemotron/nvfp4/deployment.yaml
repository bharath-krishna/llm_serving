# NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4 -- the default variant.
#
# This is one of two nemotron variants; the other is ../bf16/deployment.yaml.
# The node has ONE GPU and both request `nvidia.com/gpu: "1"`, so only one can
# ever be Running -- the other stays Pending forever. Never scale both up by
# hand; use ../switch.sh, which sequences the scale-down/scale-up (and the
# matching LMCache server) correctly.
#
# The committed default is replicas: 1 -- NVFP4 is the known-good variant, the
# one every measured constant in BENCHMARK-HANDOFF.md and
# lmcache-benchmark-report.md was taken against.
#
# HOW THE PUBLIC URL FINDS THIS POD. The pod label `serving: nemotron` (below)
# is what ../common/service-active.yaml selects on, and that Service is what the
# Ingress points at permanently. There is deliberately NO Ingress in this file:
# see ../common/ingress.yaml for what happened the last time a variant shipped
# its own. The `vllm-nemotron-nvfp4` Service at the bottom is for benchmarks,
# which target a variant explicitly so a run can never be ambiguous about which
# engine answered.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-nemotron-nvfp4
  namespace: vllm
  labels:
    app: vllm-nemotron-nvfp4
spec:
  replicas: 1 # single GPU -- switch with ../switch.sh, never by hand
  selector:
    matchLabels:
      app: vllm-nemotron-nvfp4
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm-nemotron-nvfp4
        # Selected by ../common/service-active.yaml. Both variants carry it;
        # only one pod is ever Running, so the live endpoint is unambiguous.
        serving: nemotron
        # Copied onto every scraped series by the ServiceMonitor's
        # podTargetLabels, so a metrics query can tell the variants apart.
        variant: nvfp4
    spec:
      runtimeClassName: nvidia
      hostIPC: true
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.27.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              # --served-model-name takes nargs='+': the FIRST name is what the
              # API reports, the rest are accepted aliases. The repo-ID alias is
              # load-bearing for bench/bench_config_permutator.json --
              # long-doc-permutator sizes contexts in exact tokens, so it feeds
              # `model` to AutoTokenizer.from_pretrained AND into the request
              # payload. The served name is not a repo ID (tokenizer load fails);
              # the repo ID alone would 404 here. Listing both satisfies each.
              # NEVER put a `#` comment between the backslash-continued lines below.
              # The trailing `\` joins the comment into the same logical line, the `#`
              # comments out the remainder, and the command ENDS there -- silently
              # dropping every remaining flag. That happened 2026-08-30: the engine came
              # up healthy with no --kv-transfer-config (LMCache silently disconnected),
              # no --reasoning-parser (chain-of-thought leaked into message.content) and
              # no --kv-cache-memory-bytes (pool ballooned to 19.32 GiB). Comments go here.
              #
              # KV TIERING -- the GPU pool is capped deliberately SMALL relative to
              # LMCache's L1. At 10 GiB it held 3,260,912 tokens while L1 (--l1-size-gb 4
              # at LMCache's measured 11,799 B/token) holds 364,011: the backing tier was
              # 9x SMALLER than what it backed, so nothing ever evicted (GPU KV usage
              # 2.4%) and the external hit rate sat at 6.6% -- LMCache is queried only on
              # a local miss, and with no eviction a local miss is content nobody has
              # ever seen. Shrinking the pool inverts the pyramid the right way round.
              # max-model-len must stay <= the pool's token capacity or vLLM won't start.
              # REVERT: --max-model-len 262144 --kv-cache-memory-bytes 10737418240
              exec vllm serve nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4 \
                --served-model-name nemotron-3.5-lightning nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4 \
                --max-num-seqs 32 \
                --max-model-len 131072 \
                --enable-prefix-caching \
                --async-scheduling \
                --max-num-batched-tokens 2192 \
                --mamba-backend flashinfer \
                --mamba-ssm-cache-dtype float16 \
                --gpu-memory-utilization 0.35 \
                --kv-cache-memory-bytes 536870912 \
                --mamba-cache-mode align \
                --enable-mamba-cache-stochastic-rounding \
                --mamba-cache-philox-rounds 5 \
                --reasoning-parser nemotron_v3 \
                --enable-auto-tool-choice \
                --tool-call-parser qwen3_coder \
                --host 0.0.0.0 \
                --port 8000 \
                --kv-transfer-config '{"kv_connector":"LMCacheMPConnector", "kv_role":"kv_both", "kv_connector_extra_config": {"lmcache.mp.host": "tcp://lmcache.vllm.svc.cluster.local", "lmcache.mp.port": 5555}}'
          env:
            # Shared auth for every OpenAI-compatible endpoint in this namespace.
            # Creation, rotation and the reasoning behind sharing one key across
            # both variants: ../common/SECRETS.md.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-auth
                  key: api-key
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              nvidia.com/gpu: "1"
              # Backstop against unified-memory exhaustion. On this GB10 the GPU
              # KV pool, model weights, pinned transfer buffers and the OS all
              # draw from ONE 128Gi pool; an NVIDIA-driver OOM here hard-crashes
              # the node (not a recoverable pod OOM-kill). The vllm flags cap the
              # GPU side (--kv-cache-memory-bytes 512Mi, --gpu-memory-utilization
              # 0.35 => ~45Gi ceiling for the whole engine process); this cgroup
              # limit catches host-side runaway (pinned buffers, activations)
              # with a pod restart before the box locks up.
              memory: 48Gi
            requests:
              nvidia.com/gpu: "1"
              memory: 32Gi
          # WITHOUT THESE the container counts as Ready the moment it starts, so
          # `kubectl rollout status` returns in seconds, the Service takes an
          # endpoint immediately, and the public URL serves 503s for the whole
          # 103s the checkpoint takes to load. The startupProbe is what buys
          # that load window; readiness then keeps the endpoint out of
          # vllm-nemotron-active until the engine can actually answer.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 30 # 300s budget -- checkpoint load is ~103s
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - mountPath: /root/.cache/huggingface
              name: huggingface-cache
      volumes:
        - name: huggingface-cache
          hostPath:
            path: /home/bharath/.cache/huggingface
            type: DirectoryOrCreate
      # No /dev/shm emptyDir: with `hostIPC: true` the pod already shares the
      # host's /dev/shm, which is how LMCacheMPConnector's CUDA-IPC + shared-mem
      # transfer reaches the lmcache server pod (also hostIPC: true). An emptyDir
      # here would give this pod a PRIVATE /dev/shm and break that channel.
---
# Per-variant Service. NOT what the public URL uses -- that goes through
# ../common/service-active.yaml. This one exists so benchmarks can address this
# specific engine by name and a result can never be misattributed to the other
# variant.
apiVersion: v1
kind: Service
metadata:
  name: vllm-nemotron-nvfp4
  namespace: vllm
  labels:
    app: vllm-nemotron-nvfp4
spec:
  selector:
    app: vllm-nemotron-nvfp4
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
