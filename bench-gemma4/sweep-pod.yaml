# Concurrency sweep for gemma4-31b: one pod runs every level sequentially so the
# engine is never restarted mid-sweep and levels stay comparable.
#
#   kubectl create configmap gemma4-bench-config -n vllm \
#     --from-file=bench_config.json --from-file=bench_config_mrc.json \
#     --from-file=bench_config_sweep.json --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f sweep-pod.yaml && kubectl logs -n vllm -f gemma4-sweep
#
# LEVELS is capped at 16 because the deployment runs --max-num-seqs 16; asking for
# more just queues in the client and measures nothing new.
apiVersion: v1
kind: Pod
metadata:
  name: gemma4-sweep
  namespace: vllm
  labels: { app: gemma4-sweep }
spec:
  restartPolicy: Never
  runtimeClassName: nvidia # same rootfs/CDI env; NO GPU requested
  containers:
    - name: sweep
      image: vllm/vllm-openai:v0.27.1
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -uo pipefail
          RUN="/results/gemma4-sweep-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$RUN"
          # Markers are fsync'd on every write. A DGX Spark hard reset discards
          # the page cache, which is how session 1 of the nemotron sweep lost all
          # of its evidence -- see BENCHMARK-HANDOFF.md section 3.
          mark() { echo "$(date -u +%FT%T.%3NZ) $*" \
            | dd of="$RUN/MARKERS.txt" oflag=append conv=notrunc,fsync status=none; }

          mark "sweep start levels=$LEVELS base=$CONFIG_NAME"
          for N in $LEVELS; do
            mark "level $N BEGIN"
            python3 -c "
          import json,sys
          d=json.load(open('/config/$CONFIG_NAME'))
          d['ldqa_num_inflight_requests']=int(sys.argv[1])
          json.dump(d,open(sys.argv[2],'w'),indent=2)
          " "$N" "$RUN/config-c$N.json"

            lmcache bench engine \
              --config "$RUN/config-c$N.json" \
              --no-interactive \
              --output-dir "$RUN/c$N" \
              --json 2>&1 | tee "$RUN/c$N.log"
            mark "level $N END rc=$?"
            # Let the engine drain and clocks settle before the next level, so a
            # level is not measured against the tail of its predecessor.
            sleep 30
          done

          mark "sweep COMPLETE"
          echo "===================== SWEEP SUMMARY ====================="
          for N in $LEVELS; do
            echo "--- concurrency $N ---"
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$RUN/c$N.log" 2>/dev/null \
              | grep -E "Successful requests|Failed requests|Benchmark duration|Input throughput|Output throughput|Mean TTFT|P50 TTFT|P90 TTFT|P99 TTFT|Mean decode"
          done | tee "$RUN/SUMMARY.txt"
      env:
        - name: LEVELS
          value: "1 2 4 8 12 16"
        - name: CONFIG_NAME
          value: bench_config_sweep.json
        - name: LMCACHE_DISABLE_BANNER
          value: "1"
        # Shared vllm-auth Secret; without this every request 401s.
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: vllm-auth
              key: api-key
        - name: HF_HOME
          value: /hf
        - name: HF_HUB_OFFLINE
          value: "1"
      volumeMounts:
        - { name: config, mountPath: /config, readOnly: true }
        - { name: hf, mountPath: /hf, readOnly: true }
        - { name: results, mountPath: /results }
      resources:
        requests: { cpu: "2", memory: 4Gi }
        limits: { cpu: "4", memory: 8Gi }
  volumes:
    - name: config
      configMap: { name: gemma4-bench-config }
    - name: hf
      hostPath: { path: /home/bharath/.cache/huggingface, type: Directory }
    - name: results
      hostPath: { path: /var/lib/vllm-bench-results, type: DirectoryOrCreate }
