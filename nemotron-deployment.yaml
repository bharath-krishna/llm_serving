apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-nemotron
  namespace: vllm
  labels:
    app: vllm-nemotron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-nemotron
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm-nemotron
    spec:
      runtimeClassName: nvidia
      hostIPC: true
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.27.1
          # command: ["sleep", "infinity"]
          command: ["/bin/bash", "-c"]
          args:
            - |
              exec vllm serve nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4 \
                --served-model-name nemotron-3.5-lightning \
                --max-num-seqs 32 \
                --max-model-len 262144 \
                --enable-prefix-caching \
                --async-scheduling \
                --max-num-batched-tokens 2192 \
                --mamba-backend flashinfer \
                --mamba-ssm-cache-dtype float16 \
                --gpu-memory-utilization 0.35 \
                --kv-cache-memory-bytes 10737418240 \
                --mamba-cache-mode align \
                --enable-mamba-cache-stochastic-rounding \
                --mamba-cache-philox-rounds 5 \
                --reasoning-parser nemotron_v3 \
                --enable-auto-tool-choice \
                --tool-call-parser qwen3_coder \
                --host 0.0.0.0 \
                --port 8000 \
                --kv-transfer-config '{"kv_connector":"LMCacheMPConnector", "kv_role":"kv_both", "kv_connector_extra_config": {"lmcache.mp.host": "tcp://lmcache.vllm.svc.cluster.local", "lmcache.mp.port": 5555}}'
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              nvidia.com/gpu: "1"
              # Backstop against unified-memory exhaustion. On this GB10 the GPU
              # KV pool, model weights, pinned transfer buffers and the OS all
              # draw from ONE 128Gi pool; an NVIDIA-driver OOM here hard-crashes
              # the node (not a recoverable pod OOM-kill). The vllm flags cap the
              # GPU side (--kv-cache-memory-bytes 10Gi, --gpu-memory-utilization
              # 0.35 => ~45Gi ceiling for the whole engine process); this cgroup
              # limit catches host-side runaway (pinned buffers, activations)
              # with a pod restart before the box locks up.
              memory: 48Gi
            requests:
              nvidia.com/gpu: "1"
              memory: 32Gi
          volumeMounts:
            - mountPath: /root/.cache/huggingface
              name: huggingface-cache
      volumes:
        - name: huggingface-cache
          hostPath:
            path: /home/bharath/.cache/huggingface
            type: DirectoryOrCreate
      # No /dev/shm emptyDir: with `hostIPC: true` the pod already shares the
      # host's /dev/shm, which is how LMCacheMPConnector's CUDA-IPC + shared-mem
      # transfer reaches the lmcache server pod (also hostIPC: true). An emptyDir
      # here would give this pod a PRIVATE /dev/shm and break that channel.
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-nemotron
  namespace: vllm
  labels:
    app: vllm-nemotron
spec:
  selector:
    app: vllm-nemotron
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vllm-nemotron
  namespace: vllm
  annotations:
    haproxy.org/timeout-http-request: "600s"
    haproxy.org/timeout-tunnel: "3600s"
    haproxy.org/timeout-http-keep-alive: "600s"
spec:
  ingressClassName: haproxy
  rules:
    - host: nemotron.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vllm-nemotron
                port:
                  number: 8000
    - host: nemo35-lightning.krishb.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vllm-nemotron
                port:
                  number: 8000
