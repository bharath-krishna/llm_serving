apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-nemotron
  namespace: vllm
  labels:
    app: vllm-nemotron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-nemotron
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm-nemotron
    spec:
      runtimeClassName: nvidia
      hostIPC: true
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.27.1
          # command: ["sleep", "infinity"]
          command: ["/bin/bash", "-c"]
          args:
            - |
              # --served-model-name takes nargs='+': the FIRST name is what the
              # API reports, the rest are accepted aliases. The repo-ID alias is
              # load-bearing for bench-nemotron/bench_config_permutator.json --
              # long-doc-permutator sizes contexts in exact tokens, so it feeds
              # `model` to AutoTokenizer.from_pretrained AND into the request
              # payload. The served name is not a repo ID (tokenizer load fails);
              # the repo ID alone would 404 here. Listing both satisfies each.
              # NEVER put a `#` comment between the backslash-continued lines below.
              # The trailing `\` joins the comment into the same logical line, the `#`
              # comments out the remainder, and the command ENDS there -- silently
              # dropping every remaining flag. That happened 2026-08-30: the engine came
              # up healthy with no --kv-transfer-config (LMCache silently disconnected),
              # no --reasoning-parser (chain-of-thought leaked into message.content) and
              # no --kv-cache-memory-bytes (pool ballooned to 19.32 GiB). Comments go here.
              #
              # KV TIERING -- the GPU pool is capped deliberately SMALL relative to
              # LMCache's L1. At 10 GiB it held 3,260,912 tokens while L1 (--l1-size-gb 4
              # at LMCache's measured 11,799 B/token) holds 364,011: the backing tier was
              # 9x SMALLER than what it backed, so nothing ever evicted (GPU KV usage
              # 2.4%) and the external hit rate sat at 6.6% -- LMCache is queried only on
              # a local miss, and with no eviction a local miss is content nobody has
              # ever seen. Shrinking the pool inverts the pyramid the right way round.
              # max-model-len must stay <= the pool's token capacity or vLLM won't start.
              # REVERT: --max-model-len 262144 --kv-cache-memory-bytes 10737418240
              exec vllm serve nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4 \
                --served-model-name nemotron-3.5-lightning nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4 \
                --max-num-seqs 32 \
                --max-model-len 131072 \
                --enable-prefix-caching \
                --async-scheduling \
                --max-num-batched-tokens 2192 \
                --mamba-backend flashinfer \
                --mamba-ssm-cache-dtype float16 \
                --gpu-memory-utilization 0.35 \
                --kv-cache-memory-bytes 536870912 \
                --mamba-cache-mode align \
                --enable-mamba-cache-stochastic-rounding \
                --mamba-cache-philox-rounds 5 \
                --reasoning-parser nemotron_v3 \
                --enable-auto-tool-choice \
                --tool-call-parser qwen3_coder \
                --host 0.0.0.0 \
                --port 8000 \
                --kv-transfer-config '{"kv_connector":"LMCacheMPConnector", "kv_role":"kv_both", "kv_connector_extra_config": {"lmcache.mp.host": "tcp://lmcache.vllm.svc.cluster.local", "lmcache.mp.port": 5555}}'
          env:
            # Shared auth for every OpenAI-compatible endpoint in this namespace
            # (vllm-auth Secret; gemma4 and nemotron use the same key). vLLM
            # treats VLLM_API_KEY as the fallback for --api-key
            # (entrypoints/openai/api_server.py:266), so this is equivalent to
            # passing the flag -- but the key stays out of git and out of
            # `kubectl get deploy -o yaml` argv. Without it these endpoints are
            # OPEN, UNAUTHENTICATED LLM APIs: *.krishb.in resolves publicly
            # (103.76.103.148) and already takes internet scanner traffic. That
            # is not just inference theft -- an anonymous caller can submit
            # max-model-len-sized requests, and sustained load on this box
            # hard-resets the node (BENCHMARK-HANDOFF.md section 3).
            #
            # Rotate (re-rolls BOTH deployments, and any bench pod picks it up
            # on next create):
            #   kubectl create secret generic vllm-auth -n vllm \
            #     --from-literal=api-key="sk-vllm-$(python3 -c \
            #       'import secrets;print(secrets.token_urlsafe(32))')" \
            #     --dry-run=client -o yaml | kubectl apply -f -
            #   kubectl rollout restart deploy/vllm-gemma4 deploy/vllm-nemotron -n vllm
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-auth
                  key: api-key
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              nvidia.com/gpu: "1"
              # Backstop against unified-memory exhaustion. On this GB10 the GPU
              # KV pool, model weights, pinned transfer buffers and the OS all
              # draw from ONE 128Gi pool; an NVIDIA-driver OOM here hard-crashes
              # the node (not a recoverable pod OOM-kill). The vllm flags cap the
              # GPU side (--kv-cache-memory-bytes 10Gi, --gpu-memory-utilization
              # 0.35 => ~45Gi ceiling for the whole engine process); this cgroup
              # limit catches host-side runaway (pinned buffers, activations)
              # with a pod restart before the box locks up.
              memory: 48Gi
            requests:
              nvidia.com/gpu: "1"
              memory: 32Gi
          volumeMounts:
            - mountPath: /root/.cache/huggingface
              name: huggingface-cache
      volumes:
        - name: huggingface-cache
          hostPath:
            path: /home/bharath/.cache/huggingface
            type: DirectoryOrCreate
      # No /dev/shm emptyDir: with `hostIPC: true` the pod already shares the
      # host's /dev/shm, which is how LMCacheMPConnector's CUDA-IPC + shared-mem
      # transfer reaches the lmcache server pod (also hostIPC: true). An emptyDir
      # here would give this pod a PRIVATE /dev/shm and break that channel.
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-nemotron
  namespace: vllm
  labels:
    app: vllm-nemotron
spec:
  selector:
    app: vllm-nemotron
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vllm-nemotron
  namespace: vllm
  annotations:
    haproxy.org/timeout-http-request: "600s"
    haproxy.org/timeout-tunnel: "3600s"
    haproxy.org/timeout-http-keep-alive: "600s"
spec:
  ingressClassName: haproxy
  rules:
    - host: nemotron.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vllm-nemotron
                port:
                  number: 8000
    - host: nemo35-lightning.krishb.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vllm-nemotron
                port:
                  number: 8000
