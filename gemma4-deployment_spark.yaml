# Refer this
# https://forums.developer.nvidia.com/t/gemma-4-day-1-inference-on-nvidia-dgx-spark-preliminary-benchmarks/365503
# exec vllm serve google/gemma-4-E4B \
#
# NO LMCache (--kv-transfer-config) on this model. Measured 2026-08-30:
#  1. Attaching ANY KV connector makes vLLM disable the hybrid KV cache manager
#     ("Turning off hybrid kv cache manager because `--kv-transfer-config` is
#     set"), which re-sizes Gemma-4's sliding-window layers as full attention.
#     Per-request KV at 131072 tokens goes ~8.5 GiB -> 55 GiB and the engine
#     refuses to start: "55.0 GiB KV cache is needed, which is larger than the
#     available KV cache memory (37.52 GiB) ... estimated maximum model length
#     is 89424". That is a 6.4x loss of effective KV capacity.
#  2. The documented escape hatch, --no-disable-hybrid-kv-cache-manager, is
#     rejected: "Connector LMCacheMPConnector does not support HMA but HMA is
#     enabled." This image ships lmcache 0.4.3, whose connector predates vLLM's
#     `SupportsHMA`; only 0.5.3 (in vllm/vllm-openai:v0.27.1, which the lmcache
#     server pod runs) subclasses it. A 0.4.3 client against the 0.5.3 MP server
#     would also be a protocol mismatch.
# So gemma4 is benchmarked WITHOUT LMCache -- see bench-gemma4/. Revisit only if
# this image is rebuilt on lmcache >= 0.5.3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-gemma4
  namespace: vllm
  labels:
    app: vllm-gemma4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-gemma4
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm-gemma4
    spec:
      runtimeClassName: nvidia
      hostIPC: true
      containers:
        - name: vllm
          image: vllm/vllm-openai:gemma4-cu130
          command: ["/bin/bash", "-c"]
          args:
            - |
              exec vllm serve nvidia/Gemma-4-31B-IT-NVFP4 \
                --served-model-name gemma4-31b \
                --tensor-parallel-size 1 \
                --dtype auto \
                --load-format safetensors \
                --max-model-len 131072 \
                --max-num-seqs 16 \
                --max-num-batched-tokens 8192 \
                --gpu-memory-utilization 0.60 \
                --kv-cache-dtype fp8 \
                --enable-chunked-prefill \
                --enable-prefix-caching \
                --trust-remote-code \
                --enable-auto-tool-choice \
                --tool-call-parser pythonic \
                --host 0.0.0.0 --port 8088 \
                --reasoning-parser gemma4
          env:
            # Shared auth for every OpenAI-compatible endpoint in this namespace
            # (vllm-auth Secret; gemma4 and nemotron use the same key). vLLM
            # treats VLLM_API_KEY as the fallback for --api-key
            # (entrypoints/openai/api_server.py:266), so this is equivalent to
            # passing the flag -- but the key stays out of git and out of
            # `kubectl get deploy -o yaml` argv. Without it these endpoints are
            # OPEN, UNAUTHENTICATED LLM APIs: *.krishb.in resolves publicly
            # (103.76.103.148) and already takes internet scanner traffic. That
            # is not just inference theft -- an anonymous caller can submit
            # max-model-len-sized requests, and sustained load on this box
            # hard-resets the node (BENCHMARK-HANDOFF.md section 3).
            #
            # Rotate (re-rolls BOTH deployments, and any bench pod picks it up
            # on next create):
            #   kubectl create secret generic vllm-auth -n vllm \
            #     --from-literal=api-key="sk-vllm-$(python3 -c \
            #       'import secrets;print(secrets.token_urlsafe(32))')" \
            #     --dry-run=client -o yaml | kubectl apply -f -
            #   kubectl rollout restart deploy/vllm-gemma4 deploy/vllm-nemotron -n vllm
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-auth
                  key: api-key
          ports:
            - containerPort: 8088
              name: http
          resources:
            limits:
              nvidia.com/gpu: "1"
              # Backstop against unified-memory exhaustion. On this GB10 the GPU
              # KV pool, model weights, pinned transfer buffers and the OS all
              # draw from ONE 128Gi pool; an NVIDIA-driver OOM here hard-crashes
              # the node (not a recoverable pod OOM-kill). --gpu-memory-utilization
              # 0.60 caps the GPU side (measured: 37.45 GiB KV pool => 81,808
              # tokens, 4.39x concurrency at the full 131,072-token context); this
              # cgroup limit catches host-side runaway (pinned buffers, activations)
              # with a pod restart before the box locks up.
              memory: 48Gi
            requests:
              nvidia.com/gpu: "1"
              memory: 32Gi
          volumeMounts:
            - mountPath: /root/.cache/huggingface
              name: huggingface-cache
            - mountPath: /usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/gemma4.py
              name: gemma4-patch
              subPath: gemma4_patched.py
            - mountPath: /dev/shm
              name: dshm
      volumes:
        - name: huggingface-cache
          hostPath:
            path: /home/bharath/.cache/huggingface
            type: DirectoryOrCreate
        - name: gemma4-patch
          hostPath:
            path: /home/bharath/workspace/dgx-spark-vllm-gemma4-26b-uncensored/patches
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-gemma4
  namespace: vllm
  labels:
    app: vllm-gemma4
spec:
  selector:
    app: vllm-gemma4
  ports:
    - port: 8088
      targetPort: 8088
      name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vllm-gemma4
  namespace: vllm
  annotations:
    haproxy.org/timeout-http-request: "600s"
    haproxy.org/timeout-tunnel: "3600s"
    haproxy.org/timeout-http-keep-alive: "600s"
spec:
  ingressClassName: haproxy
  rules:
    - host: gemma4.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vllm-gemma4
                port:
                  number: 8088
    - host: gemma4.krishb.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vllm-gemma4
                port:
                  number: 8088
